spring.application.name=SMS

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SMS}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

sms.jwt.secret=${JWT_SECRET}
sms.jwt.issuer=sms
sms.jwt.expiration=30m

sms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.port=${PORT:8080}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
