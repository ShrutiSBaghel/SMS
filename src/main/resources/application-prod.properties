# Required deployment values have no development fallback.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.schema=sms
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.jpa.properties.hibernate.default_schema=sms
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
sms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.error.include-message=never
server.error.include-stacktrace=never

sms.jwt.secret=${JWT_SECRET}
sms.jwt.issuer=sms
sms.jwt.expiration=30m

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
